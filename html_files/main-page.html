<body>
    <h1>Mini Chat</h1>

    <div id="messages"></div>   <!-- chat lives here -->

    <input type="text" id="nameInput" placeholder="Enter your name" value="Alice">
    <input type="text" id="msgInput" placeholder="Message...">
    <button onclick="sendData()">Send</button>
    <p id="status"></p>         <!-- errors/confirmations go here, NOT in the chat -->

    <script>
        const msgBox = document.getElementById('messages');

        // THE function that displays one message — works for history AND live
        function addMessageToPage(m) {
            const div = document.createElement('div');
            div.textContent = `${m.name}: ${m.text ?? m.time}`;
            msgBox.appendChild(div);
            div.scrollIntoView();        // auto-scroll to newest
        }

        // 1. load history once, then 2. connect the live stream
        window.addEventListener('DOMContentLoaded', async () => {
            console.log("sund request\n");
            const res = await fetch('/api/messages');
            const msgs = await res.json(); //res.text()

            console.log(msgs);
            for (const m of msgs) addMessageToPage(m);

            const events = new EventSource('/api/stream');
            events.onmessage = (e) => addMessageToPage(JSON.parse(e.data));
        });

        // sending: NO display update here — the SSE stream will bring
        // your message back and display it like everyone else's
        function sendData() {
            const payload = {
                name: document.getElementById('nameInput').value,
                text: document.getElementById('msgInput').value,
                time: new Date().toISOString()
            };

            fetch('/api/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('msgInput').value = '';  // clear input
                document.getElementById('status').innerText = '';
            })
            .catch(err => {
                document.getElementById('status').innerText = 'Error: ' + err;
            });
        }
    </script>
</body>
