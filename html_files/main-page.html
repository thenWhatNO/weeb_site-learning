<!DOCTYPE html>
<html>
<head>
    <title>POST to C Server</title>
</head>
<body>
    <h1>Send Data to C Server</h1>

    %s

    <p id="response"></p>

    <input type="text" id="nameInput" placeholder="Enter your name" value="Alice">
    <button onclick="sendData()">Send POST</button>
    
    <script>

        const events = new EventSource('/api/stream');

        events.onmessage = (e) => {
            const div = document.getElementById('response');
            div.innerText += e.data + '\n';
        };

        function sendData() {
            const name = document.getElementById('nameInput').value;
            
            const payload = {
                name: name,
                time: new Date().toISOString()
            };

            fetch('http://192.168.0.114:8080/api/data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('response').innerText = data;
            })
            .catch(error => {
                document.getElementById('response').innerText = 'Error: ' + error;
            });
        }
    </script>
</body>
</html>
