<!DOCTYPE html>
<html>
    <head>
        <title>My C Server</title>
    </head>

    <body>
        <h1>Hello from C!</h1>

        <p>This page was served by a C HTTP server.</p>
        
        <p id="response">%s</p>

        <ul>
            <li>
                <input type="text" id="mesg" placeholder="Enter your name" value="Alice">
            </li>
            <li>
                <button onclick="sundData()">
                    <div class="fake-textbox">sund</div> 
                </button>
            </li>
        </ul>
            

        <script>
            function sendData() {
                const name = document.getElementById("mesg").value;

                const playload = {
                    name : name
                }

                fetch('http://192.168.0.114:8080/api/data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(playload)                                    
                })
                .then(response => response.text())
                .then(data => {document.getElementById('response').innerText = 'Server says ' + data;})
                .catch(error => {
                    document.getElementById('response').innerText = 'error ' + error;
                })
            }
        </script>

    </body>
</html>
